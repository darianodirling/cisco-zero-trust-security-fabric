! LAB TEMPLATE ONLY - illustrative IOS XE routing skeleton
! Documentation ranges are not routable production addresses.
router ospf 100
 router-id 192.0.2.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.10.0.0 0.0.255.255 area 0
!
router bgp 65010
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 65020
 neighbor 198.51.100.2 description LAB-EDGE-PEER
 address-family ipv4
  neighbor 198.51.100.2 activate
  ! Apply explicit inbound/outbound route policies before enabling a live peer.
 exit-address-family
